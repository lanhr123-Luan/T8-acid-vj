<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>T-8 Acid VJ</title>
<style>
:root{
  --ink:#edeae3; --dim:rgba(237,234,227,.60); --faint:rgba(237,234,227,.17); --wash:rgba(237,234,227,.07);
  --panel:rgba(9,9,11,.78); --amber:#ff6a2a; --rec:#ff3350; --ok:#7ddc8a;
  --font:Bahnschrift,"DIN Alternate","Avenir Next Condensed","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);
  font:13px/1.35 var(--font);font-stretch:88%;letter-spacing:.012em;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button,select,input{font:inherit;font-stretch:inherit;letter-spacing:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---- transport bar: fades away while the music plays and the mouse rests ---- */
#bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;
  padding:9px 12px 20px;background:linear-gradient(rgba(0,0,0,.80),rgba(0,0,0,.55) 55%,rgba(0,0,0,0));
  transition:opacity .4s ease,transform .4s ease}
body.quiet{cursor:none}
body.quiet #bar,body.quiet #load{opacity:0;transform:translateY(-6px);pointer-events:none}
.cluster{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cluster.right{margin-left:auto}
.btn{appearance:none;background:var(--wash);border:1px solid var(--faint);border-radius:3px;padding:5px 11px 4px;
  cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--dim)}
.btn.on{background:var(--ink);border-color:var(--ink);color:#0b0b0d}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.wide{width:100%;margin:2px 0 8px}
#btnPlay{min-width:64px;font-weight:600}
#btnPlay.on{background:var(--amber);border-color:var(--amber);color:#170800}
.read{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.read b{color:var(--ink);font-weight:600;font-size:15px}
.conn{display:inline-flex;align-items:center;gap:7px;color:var(--dim);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.conn.ok i{background:var(--ok)} .conn.lost i{background:var(--rec)}
body.sa .conn,body.hw #btnPlay,body.hw #btnNew{display:none}

/* ---- the 16 step pads: the bass pattern itself, laid out like the T-8's step keys ---- */
.pads{display:flex;gap:3px;align-items:center}
.pads i{width:13px;height:21px;border-radius:2px;background:rgba(237,234,227,.09);box-shadow:inset 0 0 0 1px rgba(237,234,227,.10);transition:background .08s}
.pads i:nth-child(4n+1):not(:first-child){margin-left:6px}
.pads i.on{background:rgba(255,106,42,.50);box-shadow:none}
.pads i.acc{background:var(--amber);box-shadow:none}
.pads i.cur{background:var(--ink);box-shadow:0 0 12px rgba(237,234,227,.75);transition:none}

.seg{display:flex;border:1px solid var(--faint);border-radius:3px;overflow:hidden}
.seg button{appearance:none;background:var(--wash);border:0;border-right:1px solid var(--faint);padding:5px 11px 4px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:rgba(237,234,227,.14)}
.seg button[aria-selected=true]{background:var(--ink);color:#0b0b0d}
.seg button:disabled{color:var(--faint);text-decoration:line-through;cursor:not-allowed}

/* ---- settings drawer ---- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:318px;max-width:100%;z-index:4;overflow:auto;overscroll-behavior:contain;
  background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-left:1px solid var(--faint);
  padding:58px 18px 28px;transform:translateX(102%);transition:transform .26s ease;visibility:hidden}
body.open #drawer{transform:none;visibility:visible}
#drawer section{border-top:1px solid var(--faint);padding:10px 0 6px}
#drawer section:first-child{border-top:0;padding-top:0}
#drawer h2{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--amber)}
.row{display:grid;grid-template-columns:1fr auto;gap:1px 10px;align-items:baseline;margin:7px 0}
.row output{color:var(--dim);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/3;width:100%;margin:2px 0 0;height:16px;accent-color:var(--amber);cursor:pointer}
.row select{grid-column:1/3;width:100%;margin-top:3px;padding:4px 6px;background:#141416;border:1px solid var(--faint);border-radius:3px}
.row.chk{grid-template-columns:auto 1fr;align-items:center}
.row.chk input{width:15px;height:15px;margin:0;accent-color:var(--amber)}
.note{margin:2px 0 8px;color:var(--dim)}
.keys dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 8px}
.keys dt{color:var(--ink);font-variant-numeric:tabular-nums} .keys dd{margin:0;color:var(--dim)}

#hint{position:fixed;left:50%;bottom:13%;transform:translateX(-50%);z-index:3;font-size:21px;letter-spacing:.02em;
  text-align:center;text-shadow:0 1px 14px #000,0 0 2px #000;opacity:0;transition:opacity .7s;pointer-events:none;max-width:90vw}
#hint.show{opacity:.92}
#load{position:fixed;left:14px;bottom:12px;z-index:3;color:var(--dim);opacity:0;transition:opacity .3s;pointer-events:none}
#load.show{opacity:1}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);z-index:7;background:rgba(9,9,11,.86);border:1px solid var(--faint);
  border-radius:3px;padding:7px 14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#glerr{display:none;position:fixed;left:14px;right:14px;bottom:14px;z-index:9;margin:0;padding:12px 14px;white-space:pre-wrap;overflow:auto;max-height:50vh;
  background:rgba(40,6,10,.92);border:1px solid var(--rec);border-radius:3px;font:12px/1.5 ui-monospace,Consolas,monospace;color:#ffe9ec}
@media (max-width:760px){ .pads{order:9;width:100%;justify-content:center} .cluster.right{margin-left:0} }
@media (prefers-reduced-motion:reduce){ #bar,#drawer,#toast,#hint{transition:none} }
</style>
</head>
<body>
<canvas id="c" aria-label="Music visualiser"></canvas>
<header id="bar">
  <div class="cluster">
    <button class="btn" id="btnPlay" title="Space bar">Play</button>
    <button class="btn" id="btnNew" title="N">New pattern</button>
    <span class="conn wait" id="conn"><i></i><span id="connTxt">Connecting</span></span>
    <span class="read"><b id="bpm">130</b> bpm</span>
    <span class="read" id="key"></span>
  </div>
  <div class="pads" id="pads" aria-hidden="true"></div>
  <div class="cluster right">
    <div class="seg" id="scenes" role="tablist" aria-label="Scene"></div>
    <button class="btn" id="btnAuto" title="A — change scenes automatically" aria-pressed="false">Auto</button>
    <button class="btn" id="btnSound" title="S" aria-pressed="false">Sound</button>
    <button class="btn" id="btnRec" title="R — record a video of the picture and sound">Record</button>
    <button class="btn" id="btnFull" title="F">Full screen</button>
    <button class="btn" id="btnSet" title="Tab" aria-expanded="false" aria-controls="drawer">Settings</button>
  </div>
</header>
<aside id="drawer" aria-label="Settings"><div id="groups"></div></aside>
<div id="hint" role="status"></div>
<div id="load"></div>
<div id="toast" role="status"></div>
<pre id="glerr"></pre>
<script>window.T8_MODE='standalone';</script>
<script>
// ---- 00_core.js ----
'use strict';
// ============================================================================
//  t8-acid-vj  ·  core: helpers, signal bus, visual event queue
// ============================================================================
var T8 = { mode: (window.T8_MODE === 'hw') ? 'hw' : 'standalone', version: '2.0', test: {} };
function $(id) { return document.getElementById(id); }
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth01(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function fract(x) { return x - Math.floor(x); }
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// One clock for everything visual. Tests switch it to a virtual timeline for reproducible frames.
var Clock = { virtual: false, t: 0, now: function () { return this.virtual ? this.t : performance.now(); } };
var QS = (function () {
  var o = {};
  try { new URLSearchParams(location.search).forEach(function (v, k) { o[k] = v; }); } catch (e) { }
  return o;
})();
// visual randomness is seeded (reproducible renders); musical randomness is seeded only when ?seed= is given
var vrand = mulberry(QS.seed ? (parseInt(QS.seed, 10) || 1) * 7919 : 20261110);
var mrand = QS.seed ? mulberry((parseInt(QS.seed, 10) || 1) * 104729) : Math.random;

// ---------------------------------------------------------------------------
//  Sig: the one shared, time-based description of "what the music is doing".
//  Every envelope decays in seconds (never per frame), so 60 / 144 / 240 Hz
//  displays and dropped frames all look the same.
// ---------------------------------------------------------------------------
var Sig = {
  running: false, bpm: 130, step: -1, bar: 0, barInPhrase: 0,
  stepPhase: 0, beat: 0, barPhase: 0, beatCount: 0, time: 0, song: 0,
  kick: 0, snare: 0, hat: 0, ohat: 0, tom: 0, bass: 0, accent: 0, stab: 0, bell: 0, flash: 0,
  hue: 0.08, hueT: 0.08, note: 36, pitch: 0.3, slide: 0, energy: 0,
  root: 36, scale: 'natural_minor', chord: [0, 3, 7, 10], pat: [], steps: 16,
  lastStepPerf: 0, stepDur: 60 / 130 / 4,
  // per-step "afterglow" used by scenes that draw the sequence itself
  stepGlow: new Float32Array(16), stepLevel: new Float32Array(16), stepAcc: new Float32Array(16)
};
var TAU = {
  kick: 0.16, snare: 0.18, hat: 0.055, ohat: 0.20, tom: 0.22, bass: 0.22, accent: 0.30,
  stab: 0.32, bell: 0.7, flash: 0.10, slide: 0.12
};
function noteHue(note) {
  // low notes warm (amber), climbing through magenta into violet/cyan
  var lo = Sig.root - 2, hi = Sig.root + 26;
  var t = clamp((note - lo) / (hi - lo), 0, 1);
  var h = 0.10 - t * 0.52; if (h < 0) h += 1;
  return h;
}
function notePitch01(note) { return clamp((note - (Sig.root - 2)) / 28, 0, 1); }
function hueLerp(a, b, t) { var d = b - a; if (d > 0.5) d -= 1; if (d < -0.5) d += 1; return fract(a + d * t + 1); }

var Bus = {
  scene: null,
  // msg handlers shared by every transport (SSE hardware, internal engine, virtual test clock)
  start: function () {
    Sig.running = true; Sig.step = -1; Sig.bar = 0; Sig.beatCount = 0; Sig.song = 0;
    for (var i = 0; i < 16; i++) { Sig.stepGlow[i] = 0; }
    UI.setRunning(true);
    if (Bus.scene && Bus.scene.on) Bus.scene.on('start', {});
  },
  stop: function () {
    Sig.running = false; UI.setRunning(false);
    if (Bus.scene && Bus.scene.on) Bus.scene.on('stop', {});
  },
  pattern: function (m) {
    if (m.root != null) Sig.root = m.root;
    if (m.scale) Sig.scale = m.scale;
    if (m.chord && m.chord.length) Sig.chord = m.chord;
    if (m.bar != null) Sig.barInPhrase = m.bar;
    Sig.pat = m.cells || [];
    Sig.steps = Sig.pat.length || 16;
    for (var i = 0; i < 16; i++) {
      var c = Sig.pat[i];
      Sig.stepLevel[i] = (c && c.note != null) ? (0.22 + 0.78 * notePitch01(c.note)) : 0;
      Sig.stepAcc[i] = (c && c.note != null && c.accent) ? 1 : 0;
    }
    UI.setKey(Sig.scale, Sig.root); UI.setPattern(Sig.pat);
    if (Bus.scene && Bus.scene.on) Bus.scene.on('pattern', m);
  },
  step: function (ev) {
    var now = Clock.now();
    if (ev.bpm) { Sig.bpm = ev.bpm; Sig.stepDur = 60 / ev.bpm / 4; }
    if (ev.i === 0 && Sig.step !== -1) { Sig.bar++; if (UIP.auto && Sig.bar % UIP.autoBars === 0) App.wantNext = true; }
    if (ev.i % 4 === 0) Sig.beatCount++;
    Sig.step = ev.i; Sig.lastStepPerf = now;
    if (ev.on) {
      Sig.bass = Math.min(1.6, Sig.bass * 0.4 + (ev.accent ? 1.25 : 0.8));
      if (ev.accent) Sig.accent = 1;
      if (ev.note != null) { Sig.note = ev.note; Sig.hueT = noteHue(ev.note); Sig.pitch = notePitch01(ev.note); }
      Sig.slide = ev.slide ? 1 : Sig.slide;
      Sig.stepGlow[ev.i % 16] = ev.accent ? 1.5 : 1.0;
    }
    UI.setStep(ev.i, Sig.bpm);
    if (Bus.scene && Bus.scene.on) Bus.scene.on('step', ev);
  },
  drum: function (ev) {
    var v = clamp((ev.vel || 100) / 127, 0.2, 1);
    var k = ev.inst;
    if (k === 'kick') { Sig.kick = Math.max(Sig.kick, v); Sig.flash = Math.max(Sig.flash, 0.35 * v); }
    else if (k === 'snare' || k === 'clap') { Sig.snare = Math.max(Sig.snare, v); }
    else if (k === 'hat') { Sig.hat = Math.max(Sig.hat, 0.75 * v); }
    else if (k === 'ohat') { Sig.ohat = Math.max(Sig.ohat, v); Sig.hat = Math.max(Sig.hat, 0.5 * v); }
    else if (k === 'tom') { Sig.tom = Math.max(Sig.tom, v); }
    if (Bus.scene && Bus.scene.on) Bus.scene.on('drum', ev);
  },
  stab: function (ev) { Sig.stab = 1; if (Bus.scene && Bus.scene.on) Bus.scene.on('stab', ev); },
  bell: function (ev) { Sig.bell = 1; if (Bus.scene && Bus.scene.on) Bus.scene.on('bell', ev); }
};

// Visual events are queued with a due time (performance.now domain) so the picture can be
// delayed to match what is actually heard (output latency, Bluetooth speakers...).
var VQ = {
  q: [], delayMs: 0,
  push: function (type, ev, duePerf) { this.q.push({ type: type, ev: ev, t: duePerf + this.delayMs }); },
  flush: function (nowPerf) {
    var q = this.q;
    if (!q.length) return;
    q.sort(function (a, b) { return a.t - b.t; });
    var n = 0;
    while (n < q.length && q[n].t <= nowPerf) { var e = q[n++]; Bus[e.type](e.ev); }
    if (n) q.splice(0, n);
  },
  clear: function () { this.q.length = 0; }
};

function sigUpdate(dt, nowPerf) {
  var k;
  for (k in TAU) { Sig[k] *= Math.exp(-dt / TAU[k]); }
  Sig.hue = hueLerp(Sig.hue, Sig.hueT, 1 - Math.exp(-dt / 0.09));
  var gl16 = Sig.stepGlow, gd = Math.exp(-dt / 0.55);
  for (var i = 0; i < 16; i++) gl16[i] *= gd;
  if (Sig.running && Sig.step >= 0) {
    Sig.stepPhase = clamp((nowPerf - Sig.lastStepPerf) / 1000 / Sig.stepDur, 0, 1);
    Sig.beat = ((Sig.step % 4) + Sig.stepPhase) / 4;
    Sig.barPhase = (Sig.step + Sig.stepPhase) / 16;
    // song position in bars: free-runs at the tempo and is pulled gently onto the incoming steps
    var gp = Sig.bar + Sig.barPhase;
    Sig.song += dt / (16 * Sig.stepDur);
    var err = gp - Sig.song;
    if (Math.abs(err) > 0.3) Sig.song = gp; else Sig.song += err * (1 - Math.exp(-dt / 0.18));
  }
  var act = Sig.running ? 1 : 0;
  Sig.energy += (act - Sig.energy) * (1 - Math.exp(-dt / 1.2));
  Sig.time += dt;
}
// ---- 10_gl.js ----
// ============================================================================
//  WebGL2 core + HDR post pipeline (bloom, lens, filmic tonemap, FXAA, grain)
// ============================================================================
var gl = null;
var GLX = { hdr: false, w: 0, h: 0, scale: 1, vao: null, errors: [] };
var VS_FULL = '#version 300 es\nout vec2 vUv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.0-1.0,0.0,1.0);}';
var FS_HEAD = '#version 300 es\nprecision highp float;precision highp int;precision highp sampler2D;\nin vec2 vUv;out vec4 o;\n';
// shared GLSL library ---------------------------------------------------------
var GLSL_LIB = `
#define PI 3.14159265359
#define TAU 6.28318530718
float sat(float x){return clamp(x,0.0,1.0);}
vec3 sat3(vec3 x){return clamp(x,0.0,1.0);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash11(float p){p=fract(p*0.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
vec3 hash32(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));p3+=dot(p3,p3.yxz+33.33);return fract((p3.xxy+p3.yzz)*p3.zyx);}
float hash31(vec3 p3){p3=fract(p3*0.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);}
float vnoise3(vec3 p){vec3 i=floor(p),f=fract(p);vec3 u=f*f*(3.0-2.0*f);
  float a=mix(mix(hash31(i),hash31(i+vec3(1,0,0)),u.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),u.x),u.y);
  float b=mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),u.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),u.x),u.y);
  return mix(a,b,u.z);}
float fbm2(vec2 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p=p*2.03+vec2(17.3,9.1);a*=0.5;}return s;}
vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(mod(h*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0,0.0,1.0);return v*mix(vec3(1.0),k,s);}
// perceptually even-ish neon palette: hue in turns -> saturated colour with balanced luminance
vec3 neon(float h){vec3 c=hsv(fract(h),0.92,1.0);float l=dot(c,vec3(0.2627,0.678,0.0593));return c*(0.62/(0.25+l));}
float luma(vec3 c){return dot(c,vec3(0.2126,0.7152,0.0722));}
`;

function glFail(msg) {
  GLX.errors.push(msg);
  try { console.error('[t8] ' + msg); } catch (e) { }
  var el = $('glerr');
  if (el) { el.style.display = 'block'; el.textContent = msg.slice(0, 1400); }
}
function glInit(canvas) {
  gl = canvas.getContext('webgl2', {
    antialias: false, alpha: false, depth: false, stencil: false,
    powerPreference: 'high-performance', preserveDrawingBuffer: false, desynchronized: false
  });
  if (!gl) { glFail('WebGL2 unavailable: this browser / GPU cannot run the visuals (use a current Chrome or Edge).'); return false; }
  GLX.hdr = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
  gl.getExtension('OES_texture_float_linear');
  GLX.par = gl.getExtension('KHR_parallel_shader_compile');
  GLX.vao = gl.createVertexArray();
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND);
  canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); GLX.lost = true; }, false);
  canvas.addEventListener('webglcontextrestored', function () { location.reload(); }, false);
  return true;
}
function shaderLog(sh, src, name) {
  var log = gl.getShaderInfoLog(sh) || '';
  var m = /ERROR:\s*\d+:(\d+)/.exec(log), ctxl = '';
  if (m) { var L = src.split('\n'), n = parseInt(m[1], 10); ctxl = '\n>> ' + (L[n - 2] || '') + '\n>> ' + (L[n - 1] || '') + '\n>> ' + (L[n] || ''); }
  return 'shader "' + name + '" failed: ' + log + ctxl;
}
// Compiling a big ray-marching shader can take seconds on Windows (ANGLE/D3D). Nothing here asks the
// driver for a result, so with KHR_parallel_shader_compile the page keeps animating while it works.
function Prog(name, fsBody, vsSrc, noLib) {
  this.name = name; this.u = {}; this.ok = false;
  this.vsSrc = vsSrc || VS_FULL; this.fsSrc = FS_HEAD + (noLib ? '' : GLSL_LIB) + fsBody;
  var p = this.p = gl.createProgram();
  this.vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(this.vs, this.vsSrc); gl.compileShader(this.vs);
  this.fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(this.fs, this.fsSrc); gl.compileShader(this.fs);
  gl.attachShader(p, this.vs); gl.attachShader(p, this.fs); gl.linkProgram(p);
  if (Prog.collect) Prog.collect.push(this);
}
Prog.collect = null;
Prog.prototype.done = function () {
  if (this.ok) return true;
  return GLX.par ? !!gl.getProgramParameter(this.p, GLX.par.COMPLETION_STATUS_KHR) : true;
};
Prog.prototype.check = function () {
  if (this.ok) return;

        float m=a+(b-a)*ha/(ha-hn);float hm=(ro.y+rd.y*m)-farH(ro.xz+rd.xz*m);
        if(hm<0.0){b=m;hn=hm;}else{a=m;ha=hm;}

      return a+(b-a)*ha/(ha-hn);
    }
    if(h<0.0006*t)return t;
    lt=t;lh=h;
    t+=max(h*0.45,t*0.055);
    if(t>9000.0)break;

}

// ---------------- astronaut (signed distance field) ----------------
// joints: 0 hips 1 chest 2 head | 3 hip 4 knee 5 ankle 6-7 boot axis (left) | 8-12 the same (right)
//         13 shoulder 14 elbow 15 wrist (left) | 16-18 (right) | 19 body up 20 body forward
// Sizes follow the Apollo A7LB suit and its backpack: 1.83 m to the top of the helmet.
vec3 gU,gF,gR;                  // body frame
vec3 gLf,gLt,gLs,gRf,gRt,gRs;   // hand frames: along the hand, towards the thumb, through the palm
vec3 gBL,gBR;                   // boot directions
void frames(){
  gU=uJ[19];gF=uJ[20];gR=cross(gF,gU);
  vec3 ref=normalize(gF+gU);
  gLf=normalize(uJ[15]-uJ[14]);gLt=normalize(ref-gLf*dot(ref,gLf)+gR*1e-3);gLs=cross(gLf,gLt);
  gRf=normalize(uJ[18]-uJ[17]);gRt=normalize(ref-gRf*dot(ref,gRf)-gR*1e-3);gRs=cross(gRf,gRt);
  gBL=normalize(uJ[7]-uJ[6]);gBR=normalize(uJ[12]-uJ[11]);
}
float sdEll(vec3 p,vec3 r){float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.0)/k1;}
float sdDisc(vec3 l,float r,float hh){vec2 d=abs(vec2(length(l.yz),l.x))-vec2(r,hh);return min(max(d.x,d.y),0.0)+length(max(d,0.0));}
float limb(vec3 p,vec3 a,vec3 b,float ra,float rb,out float h){vec3 pa=p-a,ba=b-a;h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-mix(ra,rb,h);}
// the ribbed bellows of a pressure suit's joints, centred at h0 along a limb of length len (2.4 cm pitch)
float ribs(float h,float h0,float w,float len){return smoothstep(w,w*0.4,abs(h-h0))*(0.5+0.5*cos((h-h0)*len*261.8));}
// glove and the metal wrist ring; returns (distance, material)
vec2 hand(vec3 p,vec3 w,vec3 fd,vec3 tf,vec3 sd,float ringMat){
  vec3 q=p-w;vec3 l=vec3(dot(q,fd),dot(q,tf),dot(q,sd));
  float palm=sdRBox(l-vec3(0.068,0.0,0.0),vec3(0.060,0.047,0.027),0.025);
  float fing=sdRBox(l-vec3(0.136,-0.006,0.004),vec3(0.032,0.041,0.023),0.021);
  float thumb=sdCap(l,vec3(0.040,0.040,0.0),vec3(0.092,0.076,0.006),0.0195);
  float g=smin(smin(palm,fing,0.022),thumb,0.018);
  float ring=sdDisc(l-vec3(0.004,0.0,0.0),0.060,0.013)-0.004;
  return (ring<g)?vec2(ring,ringMat):vec2(g,7.0);
}
// lunar overshoe: l.x along the boot, l.y up (the sole's underside is at -0.09)
vec2 boot(vec3 p,vec3 a,vec3 b,vec3 d,float m){
  vec3 n=vec3(-d.y,d.x,0.0);vec3 q=p-(a+b)*0.5;vec3 l=vec3(dot(q,d),dot(q,n),q.z);
  float upper=sdRBox(l-vec3(0.0,-0.022,0.0),vec3(0.160,0.052,0.070),0.045);
  float sole=sdRBox(l-vec3(0.0,-0.074,0.0),vec3(0.168,0.016,0.076),0.012);
  return (sole<upper)?vec2(sole,m+0.25):vec2(upper,m);
}
// A loose hull around everything. Rays spend most of their steps out here, where this is all that is evaluated.
float proxyA(vec3 p){
  float d=sdCap(p,uJ[0]-gU*0.02-gF*0.08,uJ[2]+gU*0.02-gF*0.10,0.43);
  d=min(d,min(sdCap(p,uJ[3],uJ[5],0.17),sdCap(p,uJ[8],uJ[10],0.17)));
  d=min(d,min(sdCap(p,uJ[6],uJ[7],0.16),sdCap(p,uJ[11],uJ[12],0.16)));
  d=min(d,min(sdCap(p,uJ[13],uJ[15]+gLf*0.10,0.13),sdCap(p,uJ[16],uJ[18]+gRf*0.10,0.13)));
  d=min(d,sdCap(p,uJ[1]+gU*0.55-gF*0.27,uJ[1]+gU*0.95-gF*0.31,0.03));
  return d;
}
vec2 mapA(vec3 p){
  float pb=proxyA(p);
  if(pb>0.10)return vec2(pb,0.0);
  vec3 tq=p-uJ[1];vec3 tl=vec3(dot(tq,gF),dot(tq,gU),dot(tq,gR));   // chest space: x forward, y up, z right
  // torso: chest barrel, pelvis, shoulder yoke
  float d=sdRBox(tl,vec3(0.145,0.25,0.215),0.105);
  d=smin(d,sdEll(tl-vec3(0.0,-0.30,0.0),vec3(0.155,0.15,0.205)),0.07);
  d=smin(d,sdCap(tl,vec3(0.0,0.225,-0.20),vec3(0.0,0.225,0.20),0.10),0.05);
  float m=1.0,dm=d,x,h,a1,a2;
  a1=limb(p,uJ[3],uJ[4],0.110,0.093,h);a1-=0.006*ribs(h,0.86,0.16,0.43);
  a2=limb(p,uJ[4],uJ[5],0.091,0.074,h);a2-=0.006*ribs(h,0.10,0.14,0.42);
  d=smin(d,a1,0.045);d=smin(d,a2,0.03);if(a1<dm){dm=a1;m=10.0;}if(a2<dm){dm=a2;m=11.0;}
  a1=limb(p,uJ[8],uJ[9],0.110,0.093,h);a1-=0.006*ribs(h,0.86,0.16,0.43);
  a2=limb(p,uJ[9],uJ[10],0.091,0.074,h);a2-=0.006*ribs(h,0.10,0.14,0.42);
  d=smin(d,a1,0.045);d=smin(d,a2,0.03);if(a1<dm){dm=a1;m=12.0;}if(a2<dm){dm=a2;m=13.0;}
  a1=limb(p,uJ[13],uJ[14],0.092,0.079,h);a1-=0.005*(ribs(h,0.10,0.16,0.29)+ribs(h,0.90,0.14,0.29));
  a2=limb(p,uJ[14],uJ[15],0.077,0.064,h);a2-=0.005*ribs(h,0.08,0.12,0.27);
  d=smin(d,a1,0.04);d=smin(d,a2,0.028);if(a1<dm){dm=a1;m=14.0;}if(a2<dm){dm=a2;m=15.0;}
  a1=limb(p,uJ[16],uJ[17],0.092,0.079,h);a1-=0.005*(ribs(h,0.10,0.16,0.29)+ribs(h,0.90,0.14,0.29));
  a2=limb(p,uJ[17],uJ[18],0.077,0.064,h);a2-=0.005*ribs(h,0.08,0.12,0.27);
  d=smin(d,a1,0.04);d=smin(d,a2,0.028);if(a1<dm){dm=a1;m=16.0;}if(a2<dm){dm=a2;m=17.0;}
  d*=0.92;
  // life-support pack, the oxygen purge unit on top of it, the control unit on the chest
  x=sdRBox(tl-vec3(-0.268,0.085,0.0),vec3(0.115,0.33,0.235),0.035);if(x<d){d=x;m=2.0;}
  x=sdRBox(tl-vec3(-0.255,0.50,0.0),vec3(0.088,0.085,0.20),0.03);if(x<d){d=x;m=2.5;}
  x=sdRBox(tl-vec3(0.19,0.055,0.0),vec3(0.045,0.07,0.10),0.012);if(x<d){d=x;m=3.0;}
  // helmet: a white shell, cut open at the front over the gold visor
  vec3 hl=tl-vec3(0.02,0.435,0.0);float hr=length(hl);

  x=hr-0.165;if(x<d){d=x;m=4.5;}
  x=sdDisc(vec3(tl.y-0.285,tl.x-0.01,tl.z),0.138,0.020)-0.006;if(x<d){d=x;m=8.0;}
  // hose connectors on the chest (red left, blue right) and the hoses round to the pack
  vec3 hz=vec3(tl.x,tl.y,abs(tl.z));
  x=sdDisc(hz-vec3(0.155,-0.11,0.095),0.030,0.022)-0.003;if(x<d){d=x;m=(tl.z<0.0)?5.5:5.7;}
  x=min(sdCap(hz,vec3(0.170,-0.11,0.095),vec3(0.085,-0.165,0.232),0.019),sdCap(hz,vec3(0.085,-0.165,0.232),vec3(-0.16,-0.13,0.236),0.019));
  if(x<d){d=x;m=5.0;}
  x=sdCap(tl,vec3(-0.27,0.585,0.12),vec3(-0.305,0.93,0.12),0.008);if(x<d){d=x;m=9.0;}
  vec2 r;
  r=boot(p,uJ[6],uJ[7],gBL,6.0);if(r.x<d){d=r.x;m=r.y;}
  r=boot(p,uJ[11],uJ[12],gBR,6.5);if(r.x<d){d=r.x;m=r.y;}
  r=hand(p,uJ[15],gLf,gLt,gLs,7.5);if(r.x<d){d=r.x;m=r.y;}
  r=hand(p,uJ[18],gRf,gRt,gRs,7.7);if(r.x<d){d=r.x;m=r.y;}

}
vec3 normalA(vec3 p){const vec2 e=vec2(0.0012,-0.0012);
  return normalize(e.xyy*mapA(p+e.xyy).x+e.yyx*mapA(p+e.yyx).x+e.yxy*mapA(p+e.yxy).x+e.xxx*mapA(p+e.xxx).x);}
bool boundA(vec3 ro,vec3 rd,out float t0,out float t1){
  vec3 oc=ro-(uJ[0]+uJ[19]*0.12);float b=dot(oc,rd);float c=dot(oc,oc)-BR*BR;float h=b*b-c;
  t0=0.0;t1=0.0;
  if(h<0.0)return false;h=sqrt(h);t0=max(-b-h,0.0);t1=-b+h;return t1>0.0;
}
vec2 marchA(vec3 ro,vec3 rd){
  float t0,t1;if(!boundA(ro,rd,t0,t1))return vec2(-1.0,0.0);
  float t=t0;
  for(int i=0;i<90;i++){vec2 r=mapA(ro+rd*t);if(r.x<0.0006*t+0.0003)return vec2(t,r.y);t+=r.x;if(t>t1)break;}
  return vec2(-1.0,0.0);
}
float shadowA(vec3 p){
  float t0,t1;if(!boundA(p,uSun,t0,t1))return 1.0;
  float res=1.0,t=max(t0,0.02);
  for(int i=0;i<48;i++){float d=mapA(p+uSun*t).x;if(d<0.001)return 0.0;res=min(res,40.0*d/t);t+=clamp(d,0.010,0.30);if(t>t1)break;}
  return sat(res);

float aoA(vec3 p,vec3 n){float a=0.0,s=1.0;for(int i=1;i<=4;i++){float h=0.03*float(i);a+=(h-mapA(p+n*h).x)*s;s*=0.6;}return sat(1.0-3.0*a);}

// ---------------- sky ----------------
vec3 starLayer(vec3 rd,float sc,float seed){
  vec3 a=abs(rd);vec2 uv;float face;
  if(a.x>a.y&&a.x>a.z){uv=rd.yz/a.x;face=rd.x>0.0?0.0:1.0;}
  else if(a.y>a.z){uv=rd.xz/a.y;face=rd.y>0.0?2.0:3.0;}
  else{uv=rd.xy/a.z;face=rd.z>0.0?4.0:5.0;}
  vec2 g=uv*sc;vec2 id=floor(g);vec2 f=fract(g)-0.5;
  vec3 rn=hash32(id+face*37.0+seed);
  float d=length(f-(rn.xy-0.5)*0.7);
  float mag=pow(rn.z,16.0);
  float tw=0.8+0.2*sin(uT*(2.0+6.0*rn.x)+rn.y*40.0)+uHat*1.3*step(0.5,rn.x);
  vec3 tint=mix(vec3(1.0,0.84,0.66),vec3(0.70,0.82,1.0),rn.y);
  return tint*smoothstep(0.055,0.0,d)*2.4*mag*tw;
}
vec3 skyCol(vec3 rd){
  // a daylit camera sees very few stars: only the brightest survive the exposure
  vec3 c=starLayer(rd,90.0,0.0)+starLayer(rd,210.0,9.0)*0.5;
  // sparkle (bells)
  if(uSpark.w>0.001){
    vec3 dv=rd-normalize(uSpark.xyz);float d=length(dv);
    float cx=abs(dot(dv,uU)),cy=abs(dot(dv,uV));
    c+=vec3(1.0,0.93,0.78)*uSpark.w*(0.000010/(d*d+0.000004)+0.0000018/(cx*cy+0.0000012)*exp(-d*42.0));
  }
  return c;
}
vec3 earthCol(vec3 rd,out float alpha){
  alpha=0.0;
  vec3 c=uEarth*100.0;float R=5.6;
  float b=dot(rd,c);float h=b*b-(dot(c,c)-R*R);
  vec3 col=vec3(0.0);
  if(h>0.0){
    float t=b-sqrt(h);vec3 n=normalize(rd*t-c);
    float ndl=dot(n,uSun);float day=smoothstep(-0.08,0.20,ndl);
    vec3 q=n;q.xz*=rot(uT*0.010+1.0);q.xy*=rot(0.41);
    float land=fbm3(q*2.1+vec3(1.7,0.3,4.1));
    float lm=smoothstep(0.545,0.60,land);
    vec3 sea=mix(vec3(0.010,0.045,0.17),vec3(0.025,0.11,0.28),sat(land*1.6));
    vec3 gnd=mix(vec3(0.10,0.15,0.07),vec3(0.34,0.27,0.17),smoothstep(0.60,0.74,land+0.08*vnoise3(q*9.0)));
    gnd=mix(gnd,vec3(0.85),smoothstep(0.80,0.95,abs(q.y)));
    vec3 sf=mix(sea,gnd,lm);
    // weather systems: noise warped by itself so the cloud bands curl
    vec3 qw=q+0.26*vec3(fbm3(q*2.6+5.0),fbm3(q*2.6+11.0),fbm3(q*2.6+19.0));
    float cl=fbm3(qw*3.4+vec3(uT*0.005,7.0,0.0))*0.62+fbm3(qw*9.0-vec3(0.0,uT*0.003,3.0))*0.38;
    cl=smoothstep(0.43,0.70,cl+0.07*sin(q.y*9.0+qw.x*4.0));
    sf=mix(sf,vec3(0.92,0.94,0.97),cl*0.95);
    float ndv=sat(dot(n,-rd));
    vec3 hv=normalize(uSun-rd);
    sf+=vec3(1.0,0.9,0.7)*pow(sat(dot(n,hv)),80.0)*(1.0-lm)*(1.0-cl)*0.8;
    col=sf*SUNI*0.50*day*sat(ndl*0.8+0.2);
    // air: a thin blue limb, brightest on the day side
    col+=vec3(0.20,0.44,1.0)*pow(1.0-ndv,3.5)*0.9*day*(1.0+uSnare*1.2);
    alpha=1.0;
  }else{
    float ang=acos(clamp(dot(rd,uEarth),-1.0,1.0));
    float halo=exp(-max(ang-0.0561,0.0)*150.0);
    col=vec3(0.20,0.42,1.0)*halo*0.30*sat(dot(normalize(rd-uEarth*dot(rd,uEarth)),uSun)*1.6-0.15)*(1.0+uSnare*1.2);
  }
  return col;
}

// ---------------- shading ----------------
// value noise with its gradient
vec3 vnoised(vec2 p){
  vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f),du=6.0*f*(1.0-f);
  float a=hash21(i),b=hash21(i+vec2(1.0,0.0)),c=hash21(i+vec2(0.0,1.0)),d=hash21(i+vec2(1.0,1.0));
  return vec3(a+(b-a)*u.x+(c-a)*u.y+(a-b-c+d)*u.x*u.y,du*(vec2(b-a,c-a)+(a-b-c+d)*u.yx));
}
// Lunar soil scatters light back towards its source: brightest with the sun behind the camera, with a
// sharp surge at zero phase, and it does not darken towards grazing view the way a matte surface does.
vec3 regolith(vec3 alb,vec3 n,vec3 rd,float sh){
  float mu0=max(dot(n,uSun),0.0),mu=max(dot(n,-rd),0.03);
  float g=acos(clamp(dot(-rd,uSun),-1.0,1.0));
  float ph=0.60+0.74*exp(-g*1.15)+0.45*exp(-g*9.0);
  float ls=2.0*mu0/(mu0+mu);
  return alb*SUNI*sh*ph*mix(ls,2.4*mu0,0.42)*0.86;
}
// the print of a ribbed boot sole, as a height (metres); d.x runs along the boot
float printH(vec2 d){
  vec2 e=abs(d)/vec2(0.165,0.072);
  float k=pow(e.x*e.x*e.x+e.y*e.y*e.y,0.3333);
  float inside=smoothstep(1.0,0.84,k);
  float ribs=smoothstep(0.30,0.70,0.5+0.5*cos(d.x*251.0));
  return -0.017*inside+0.007*inside*ribs*smoothstep(0.92,0.70,k)+0.005*smoothstep(1.40,1.02,k)*smoothstep(0.84,1.0,k);
}
vec3 shadeG(vec3 p,vec3 rd,float t,float sM){
  vec2 q=p.xz;
  float sx=t*uPix;                                   // one pixel across the view (metres)...
  float cg=max(-rd.y,0.004);                         // ...is stretched by 1/cg along the view where it skims the ground
  float s=max(max(sx*inversesqrt(cg),0.25*sx/cg),0.003);
  float e=max(s*0.75,0.022);
  float h1=terrH(q+vec2(e,0.0),s),h2=terrH(q-vec2(e,0.0),s),h3=terrH(q+vec2(0.0,e),s),h4=terrH(q-vec2(0.0,e),s);
  vec3 n=normalize(vec3(h2-h1,2.0*e,h4-h3));
  float hc=0.25*(h1+h2+h3+h4);
  vec3 L=lanes(q.y);
  vec4 ta=textureLod(uTA,q/SA,log2(max(s*4.0,1.0)));
  vec4 tb=textureLod(uTB,q/SB,log2(max(s*32.0,1.0)));
  float dfade=1.0-smoothstep(2.0,4.0,s);
  float rock=sat(tb.b)*L.y*dfade;
  // tone: dark mare soil, mottled; fresh craters throw brighter material around themselves
  vec3 alb=vec3(0.150,0.141,0.132)*(0.80+0.42*ta.b)*(0.90+0.22*tb.a*dfade);
  alb*=1.0+0.50*sat(ta.g)*L.x;
  alb=mix(alb,alb*1.22+0.012,rock*0.7);
  // clods and grains finer than the height maps
  vec2 g=vec2(0.0);
  float f0=1.0-smoothstep(0.020,0.060,s);if(f0>0.0)g+=f0*0.090*vnoised(q*17.0).yz;
  float f1=1.0-smoothstep(0.006,0.020,s);if(f1>0.0)g+=f1*0.100*vnoised(q*57.0+7.0).yz;
  float f2=1.0-smoothstep(0.0018,0.006,s);if(f2>0.0)g+=f2*0.090*vnoised(q*190.0+3.0).yz;
  n=normalize(n-vec3(g.x,0.0,g.y)*(1.0-0.5*rock));
  // boot prints
  float prSh=1.0;
  float wF=1.0-smoothstep(0.010,0.035,s),wT=1.0-smoothstep(0.06,0.20,s);
  if(wT>0.0&&abs(q.y)<0.40){
    vec2 sd=normalize(uSun.xz);float tanE=uSun.y/length(uSun.xz);
    for(int i=0;i<16;i++){
      vec4 f=uFoot[i];if(f.w<0.5)continue;
      vec2 d=q-f.xy;if(abs(d.x)>0.27||abs(d.y)>0.14)continue;
      float h0=printH(d);
      alb*=1.0-0.42*(1.0-wF)*wT*smoothstep(-0.002,-0.012,h0);
      if(wF<=0.0)continue;
      float hx=printH(d+vec2(0.004,0.0)),hz=printH(d+vec2(0.0,0.004));
      n=normalize(n+wF*vec3(h0-hx,0.0,h0-hz)/0.004);
      // the wall on the sun's side shades the floor of the print
      float o1=printH(d+sd*0.012)-h0-0.012*tanE,o2=printH(d+sd*0.030)-h0-0.030*tanE;
      prSh=min(prSh,1.0-wF*smoothstep(0.0,0.003,max(o1,o2)));
      alb*=1.0-wF*0.20*smoothstep(-0.003,-0.012,h0);
    }
  }
  vec3 ps=vec3(p.x,hc,p.z);
  float sh=shadowT(ps+vec3(0.0,0.006+0.25*s,0.0),s);
  if(sh>0.0)sh*=shadowA(ps+vec3(0.0,0.012,0.0));
  sh*=prSh;
  vec3 col=regolith(alb,n,rd,sh);
  // shadows are filled only by light scattered off the sunlit ground around them, and a trace of earthshine
  col+=alb*(0.050*vec3(1.0,0.96,0.90)+0.012*vec3(0.5,0.65,1.0)*sat(dot(n,uEarth)+0.3))*(0.55+0.45*n.y)*SUNI*0.33;
  // contact shadow under the boots
  vec3 dq=p-uJ[0];
  if(dot(dq,dq)<3.2){vec2 cd=mapA(p+vec3(0.0,0.03,0.0));if(cd.y>0.5)col*=0.45+0.55*smoothstep(0.0,0.16,cd.x);}
  return col;
}
vec3 shadeFar(vec3 p,vec3 rd,float t){
